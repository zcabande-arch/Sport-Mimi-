<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZO Studio</title>
<meta name="description" content="Le planning Instagram de ZO Studio : le prochain post, ses visuels à enregistrer, la légende à copier et le suivi de ce qui est publié.">
<meta name="theme-color" content="#f3eee6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZO Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one screen per tab (Aujourd'hui, Planning, Calendrier) above a bottom tab bar; a post opens in a full-height sheet */
:root{
  --bg:#f3eee6; --paper:#fbf8f3; --sunk:#ece5da; --ink:#3b2a20; --muted:#7b6a5d; --line:#e2d8ca;
  --sage:#6f8d74; --sage-soft:#e3ebe2; --teal:#2f5c5c; --teal-soft:#dde9e8;
  --plum:#8a3f6b; --plum-soft:#f1e1ea; --gold:#9a7428; --gold-soft:#f3e8d2; --late:#b24a2e; --late-soft:#f6e0d8;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1714; --paper:#25201b; --sunk:#171310; --ink:#f0e8dd; --muted:#b3a597; --line:#3a322b;
  --sage:#a5c1a9; --sage-soft:#2c362d; --teal:#9fcfcf; --teal-soft:#21302f;
  --plum:#e7a3cb; --plum-soft:#3a2432; --gold:#e0bd78; --gold-soft:#3a3022; --late:#f08f72; --late-soft:#3d2620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1714; --paper:#25201b; --sunk:#171310; --ink:#f0e8dd; --muted:#b3a597; --line:#3a322b;
  --sage:#a5c1a9; --sage-soft:#2c362d; --teal:#9fcfcf; --teal-soft:#21302f;
  --plum:#e7a3cb; --plum-soft:#3a2432; --gold:#e0bd78; --gold-soft:#3a3022; --late:#f08f72; --late-soft:#3d2620; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
main{max-width:760px;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(var(--tabbar) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,8vw,44px);line-height:1.05}
h2{font-size:26px;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}

/* progress */
.prog{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog-n{font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--sunk);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .4s}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.hero{padding:18px}
.hero h2{font-size:clamp(26px,6.5vw,32px);margin:8px 0 12px}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.day{font-weight:700}
.time{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.count{font-weight:700;color:var(--sage)}
.count.late{color:var(--late)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.fmt{background:var(--ink);color:var(--paper)}
.pil{background:var(--sage-soft);color:var(--sage)}
[data-pil="Business"] .pil,[data-pil="Excel"] .pil{background:var(--teal-soft);color:var(--teal)}
[data-pil="Corps"] .pil{background:var(--plum-soft);color:var(--plum)}
[data-pil="Coulisses"] .pil,[data-pil="Vente"] .pil{background:var(--gold-soft);color:var(--gold)}
.badge-late{background:var(--late-soft);color:var(--late)}
.badge-done{background:var(--sage-soft);color:var(--sage)}
.prod{font-size:13px;color:var(--muted)}

.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x proximity;margin:0 -2px;-webkit-overflow-scrolling:touch}
.strip figure{margin:0;flex:0 0 auto;position:relative;scroll-snap-align:start}
.zoom{padding:0;border:0;background:none;cursor:zoom-in;display:block;border-radius:10px}
.strip img{height:180px;width:auto;border-radius:10px;border:1px solid var(--line);display:block;background:var(--sunk)}
.strip.small img{height:110px}
.strip figcaption{position:absolute;top:6px;left:6px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px;pointer-events:none}
.ph{width:135px;height:180px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;padding:10px;color:var(--muted);font-size:13px;cursor:pointer;background:none}
.strip.small .ph{width:84px;height:110px;font-size:11px}
.how{font-size:14px;color:var(--muted);margin:10px 0 0}
.how strong{color:var(--ink)}

.actions{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:8px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:10px 8px;min-width:0;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sage{background:var(--sage);color:var(--paper);border-color:var(--sage)}
.btn.wide{grid-column:1 / -1}
.btn:focus-visible,.icon-btn:focus-visible,.zoom:focus-visible,.row:focus-visible,.tab:focus-visible,.cell:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.section-title{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.list{display:flex;flex-direction:column;gap:10px}

/* planning rows */
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.row.is-done{opacity:.55}
.row img,.row .noimg{width:56px;height:70px;object-fit:cover;border-radius:8px;background:var(--sunk);display:block}
.row-main{min-width:0}
.row-title{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.15;margin:3px 0 4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row-when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.is-done .check{background:var(--sage);border-color:var(--sage);color:var(--paper)}
.check svg{width:16px;height:16px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.filter{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.week-h{font-family:var(--display);font-size:22px;font-weight:600;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* calendar */
.month{margin-bottom:22px}
.month h2{margin-bottom:10px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-variant-numeric:tabular-nums;background:none;border:1px solid transparent;padding:0}
.cell.has{background:var(--paper);border-color:var(--line);cursor:pointer;font-weight:700}
.cell.today{border-color:var(--ink);border-width:2px}
.cell .dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}
.cell[data-pil="Business"] .dot,.cell[data-pil="Excel"] .dot{background:var(--teal)}
.cell[data-pil="Corps"] .dot{background:var(--plum)}
.cell[data-pil="Coulisses"] .dot,.cell[data-pil="Vente"] .dot{background:var(--gold)}
.cell.is-done{background:var(--sage-soft);border-color:var(--sage-soft)}
.cell.is-done .dot{background:none;width:auto;height:auto;color:var(--sage);font-size:11px;line-height:1}
.cell.is-late .dot{box-shadow:0 0 0 2px var(--late-soft),0 0 0 3px var(--late)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:520px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:52px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--sunk)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-in{max-width:760px;margin:0 auto}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0;box-shadow:0 -60px 0 60px var(--bg)}
.sheet h2{font-size:clamp(28px,7vw,36px);margin:10px 0 14px}
.cap{margin-top:16px}
.cap-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.cap textarea{width:100%;min-height:280px;resize:vertical;font:15px/1.5 var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.cap textarea:focus{outline:2px solid var(--sage);outline-offset:1px}
.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;padding:4px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain;border-radius:8px}
.lb-bar{display:flex;gap:10px;align-items:center;color:#f3eee6;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.lb-bar button{font:600 15px var(--body);background:#f3eee6;color:#3b2a20;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:44px;min-height:44px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100% - 32px);text-align:center}

/* boutique */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.listing{display:grid;grid-template-columns:92px 1fr;gap:12px}
.listing img,.listing .noimg{width:92px;height:92px;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.listing h3{font-family:var(--body);font-size:15px;font-weight:600;line-height:1.3;margin:2px 0 4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.plan-state{font-size:13px;color:var(--muted);margin-top:4px}
.plan-state.none{color:var(--late);font-weight:600}
.listing .actions{grid-column:1 / -1;margin-top:4px}
.badge-new{background:var(--plum-soft);color:var(--plum)}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--plum-soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:18px;border:0;width:100%;text-align:left;cursor:pointer}
.alert b{color:var(--plum)}
.etsy{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--gold-soft)}
.etsy a{color:var(--ink);font-weight:700}
.steps{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.steps li{margin:4px 0}
.steps code{font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:5px;color:var(--ink)}

/* settings */
.settings .card{margin-bottom:12px}
.opt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
</style>
</head>
<body>

<main>
  <section id="v-today" aria-labelledby="t-today"></section>
  <section id="v-plan" hidden aria-labelledby="t-plan"></section>
  <section id="v-cal" hidden aria-labelledby="t-cal"></section>
  <section id="v-shop" hidden aria-labelledby="t-shop"></section>
</main>

<nav class="tabs" aria-label="Navigation"><div class="tabs-in" role="tablist">
  <button class="tab" role="tab" data-view="today" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
  <button class="tab" role="tab" data-view="plan" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Planning</button>
  <button class="tab" role="tab" data-view="cal" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendrier</button>
  <button class="tab" role="tab" data-view="shop" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>Boutique</button>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Post"><div class="sheet-in" id="sheet-in"></div></div>
<div class="sheet settings" id="settings" hidden role="dialog" aria-modal="true" aria-label="Réglages"><div class="sheet-in" id="settings-in"></div></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Visuel en grand">
  <img id="lb-img" alt="">
  <div class="lb-bar"><button type="button" id="lb-prev" aria-label="Visuel précédent">‹</button><span id="lb-count"></span><button type="button" id="lb-next" aria-label="Visuel suivant">›</button><button type="button" id="lb-close">Fermer</button></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="photo-input" accept="image/*" hidden>

<script src="posts.js"></script>
<script>
(function(){
"use strict";
const VERSION = "zo-v2";
const KEY = "zo-planning-done";
const KEY_EDIT = "zo-captions";
const KEY_THEME = "zo-theme";
const KEY_CUSTOM = "zo-custom-posts";       // posts ajoutés depuis la boutique
const SHOP_URL = "https://www.etsy.com/shop/zoestudioapp";
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
  insta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',

/* ---------- données ---------- */
const base = window.POSTS.map(p => {
  const [y, m, d] = p.id.split("-").map(Number);
  const [hh, mm] = p.time.split("h").map(Number);
  return Object.assign({}, p, { at: new Date(y, m - 1, d, hh, mm || 0) });
});
let custom = load(KEY_CUSTOM, []);
let posts = [], byId = {};
function rebuild(){
  posts = base.concat(custom.map(c => Object.assign({}, c, { at: new Date(c.at) }))).sort((a, b) => a.at - b.at);
  byId = Object.fromEntries(posts.map(p => [p.id, p]));
}
rebuild();

let done = load(KEY, {});
let edits = load(KEY_EDIT, {});
const caption = p => edits[p.id] != null ? edits[p.id] : p.caption;
const isDone = p => !!done[p.id];
const isLate = (p, now) => !isDone(p) && p.at < now;
function setDone(id, on){ done[id] = on; save(KEY, done); render(); }

/* photos ajoutées par l'utilisatrice (« Ta photo ») : gardées dans IndexedDB */
const photos = {};
const idb = new Promise(res => {
  try {
    const r = indexedDB.open("zo-studio", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos");
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
  } catch (e) { res(null); }
});
const photoKey = (id, i) => id + "#" + i;
async function loadPhotos(){
  const db = await idb; if (!db) return;
  await new Promise(res => {
    const req = db.transaction("photos").objectStore("photos").openCursor();
    req.onsuccess = () => { const c = req.result; if (!c) return res(); photos[c.key] = c.value; c.continue(); };
    req.onerror = () => res();
  });
}
async function putPhoto(key, blob){
  photos[key] = blob;
  const db = await idb; if (!db) return;
  db.transaction("photos", "readwrite").objectStore("photos").put(blob, key);
}
const urls = {};
const photoUrl = key => photos[key] ? (urls[key] = urls[key] || URL.createObjectURL(photos[key])) : null;

/* ---------- boutique Etsy (zo/shop.json, mis à jour chaque jour par GitHub) ---------- */
let shop = null;
async function loadShop(){
  try {
    const r = await fetch("shop.json", { cache: "no-cache" });
    if (r.ok) { shop = await r.json(); save("zo-shop", shop); }
  } catch (e) {}
  if (!shop) shop = load("zo-shop", null);
}
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
// quels mots d'un titre d'annonce correspondent à quel produit du planning
const PRODUCT_WORDS = {
  "Phase Gym": ["phase gym"],
  "Carnet d'Épargne": ["epargne"],
  "Kit Auto-entrepreneur 2026": ["auto-entrepreneur", "auto entrepreneur", "autoentrepreneur", "micro-entreprise", "micro entreprise"],
  "Guide Excel": ["excel"],
  "Take Out": ["take out"]
};
const listingsFor = p => !shop ? [] : shop.listings.filter(l =>
  p.listingId ? l.id === p.listingId : (PRODUCT_WORDS[p.product] || []).some(w => norm(l.title).includes(w)));
const postsFor = l => posts.filter(p => p.listingId === l.id || (!p.listingId && (PRODUCT_WORDS[p.product] || []).some(w => norm(l.title).includes(w))));
const shortTitle = t => t.split(/\s[|–—-]\s|\s?\|\s?|,/)[0].trim();
const money = (v, c) => v == null ? "" : v.toLocaleString("fr-FR", { style: "currency", currency: c || "EUR" });
const isNew = l => Date.now() - new Date(l.firstSeen) < 14 * 864e5;
const unplanned = () => !shop ? [] : shop.listings.filter(l => !postsFor(l).some(p => !isDone(p)));

function captionFor(l){
  const name = shortTitle(l.title);
  const desc = (l.description || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
  const intro = desc.slice(0, 2).join("\n\n").slice(0, 320);
  const tags = l.tags.slice(0, 5).map(t => "#" + norm(t).replace(/[^a-z0-9]/g, "")).filter(t => t.length > 2);
  return "Nouveau dans la boutique : " + name + " ✨\n\n" + (intro ? intro + "\n\n" : "") +
    (l.price != null ? money(l.price, l.currency) + ", en téléchargement immédiat sur Etsy. " : "") + "Lien en bio.\n\n" +
    "Enregistre ce post pour plus tard 📌 et dis-moi en commentaire si tu veux que je te montre l'intérieur 👇" +
    (tags.length ? "\n\n" + tags.concat(["#etsyfrance", "#boutiqueetsy"]).join(" ") : "");
}
// premier jour libre à partir de demain : 12h30 en semaine, 10h le week-end (comme les carrousels du planning)
function nextSlot(){
  const taken = new Set(posts.map(p => startOfDay(p.at).getTime()));
  const d = startOfDay(new Date()); d.setDate(d.getDate() + 1);
  while (taken.has(d.getTime())) d.setDate(d.getDate() + 1);
  const we = d.getDay() === 0 || d.getDay() === 6;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), we ? 10 : 12, we ? 0 : 30);
}
function addListingPost(id){
  const l = shop.listings.find(x => x.id === id); if (!l) return;
  const name = shortTitle(l.title), at = nextSlot();
  const p = {
    id: "etsy-" + l.id + "-" + Date.now().toString(36), custom: true, listingId: l.id,
    pillar: "Vente", format: "Carrousel", product: name, title: "Nouveau : " + name,
    time: fmtTime(at), at: at.toISOString(),
    how: "Les photos de ton annonce Etsy, dans l'ordre. En story le même jour : partage le post avec un sticker lien vers l'annonce.",
    caption: captionFor(l), images: l.images.length ? l.images : [{ ph: "Photo du produit" }]
  };
  custom.push(p); save(KEY_CUSTOM, custom); rebuild();
  toast("Ajouté au planning : " + fmtDay(at)); openPost(p.id);
}
function removeCustom(id){
  custom = custom.filter(c => c.id !== id); save(KEY_CUSTOM, custom); rebuild();
  toast("Retiré du planning"); closeSheets();
}

/* ---------- dates ---------- */
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 864e5);
const fmtTime = d => d.getHours() + "h" + String(d.getMinutes()).padStart(2, "0");
const fmtDay = d => DAYS[d.getDay()].replace(/^./, c => c.toUpperCase()) + " " + d.getDate() + " " + MONTHS[d.getMonth()];
function relDay(d, now){
  const n = dayDiff(d, now);
  if (n === 0) return "Aujourd'hui";
  if (n === 1) return "Demain";
  if (n === -1) return "Hier";
  return fmtDay(d);
}
function countdown(d, now){
  const ms = d - now, abs = Math.abs(ms), min = Math.round(abs / 6e4);
  const txt = min < 60 ? min + " min" : min < 1440 ? Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0") : Math.round(min / 1440) + " j";
  return ms >= 0 ? "dans " + txt : "il y a " + txt;
}
function weekStart(d){ const s = startOfDay(d); s.setDate(s.getDate() - ((s.getDay() + 6) % 7)); return s; }

/* ---------- petits morceaux ---------- */
function chips(p, now){
  return '<span class="chip fmt">' + esc(p.format) + '</span><span class="chip pil">' + esc(p.pillar) + '</span>' +
    (isDone(p) ? '<span class="chip badge-done">Publié</span>' : isLate(p, now) ? '<span class="chip badge-late">En retard</span>' : '');
}
function strip(p, small){
  return '<div class="strip' + (small ? " small" : "") + '">' + p.images.map((im, i) => {
    const key = photoKey(p.id, i), own = photoUrl(key);
    if (im.ph && !own) return '<figure><button type="button" class="ph" data-photo="' + key + '">' + esc(im.ph) + '<br>+ ajouter</button><figcaption>' + (i + 1) + '</figcaption></figure>';
    const src = own || im.src;
    return '<figure><button type="button" class="zoom" data-post="' + p.id + '" data-i="' + i + '" aria-label="Agrandir le visuel ' + (i + 1) + '"><img src="' + src + '" alt="Visuel ' + (i + 1) + '" loading="lazy"' +
      (im.w ? ' width="' + im.w + '" height="' + im.h + '"' : '') + '></button><figcaption>' + (i + 1) + '</figcaption></figure>';
  }).join("") + '</div>';
}
function thumb(p){
  const i = p.images.findIndex((im, j) => !im.ph || photos[photoKey(p.id, j)]);
  if (i < 0) return '<span class="noimg" aria-hidden="true"></span>';
  return '<img src="' + (photoUrl(photoKey(p.id, i)) || p.images[i].src) + '" alt="" loading="lazy">';
}
function row(p, now){
  return '<button type="button" class="row' + (isDone(p) ? " is-done" : "") + '" data-open="' + p.id + '" data-pil="' + esc(p.pillar) + '">' + thumb(p) +
    '<span class="row-main"><span class="chips">' + chips(p, now) + '</span><span class="row-title">' + esc(p.title) + '</span>' +
    '<span class="row-when">' + esc(relDay(p.at, now)) + ' · ' + fmtTime(p.at) + ' · ' + esc(p.product) + '</span></span>' +
    '<span class="check" data-toggle="' + p.id + '" role="checkbox" aria-checked="' + isDone(p) + '" aria-label="Publié">' + ICON.check + '</span></button>';
}
function actions(p){
  return '<div class="actions">' +
    '<button type="button" class="btn primary wide" data-save="' + p.id + '">' + ICON.save + 'Enregistrer les visuels</button>' +
    '<button type="button" class="btn" data-copy="' + p.id + '">' + ICON.copy + 'Copier la légende</button>' +
    '<a class="btn" href="instagram://camera" data-insta>' + ICON.insta + 'Instagram</a>' +
    '<button type="button" class="btn wide ' + (isDone(p) ? "" : "sage") + '" data-toggle="' + p.id + '">' + ICON.check + (isDone(p) ? "Annuler « Publié »" : "C'est publié") + '</button>' +
    '</div>';
}

/* ---------- vues ---------- */
let view = "today", filter = "Tous";

function renderToday(now){
  const total = posts.length, n = posts.filter(isDone).length;
  const late = posts.filter(p => isLate(p, now));
  const next = posts.find(p => !isDone(p) && p.at >= now);
  const todays = posts.filter(p => dayDiff(p.at, now) === 0);
  const hello = now.getHours() < 18 ? "Bonjour Zoé" : "Bonsoir Zoé";
  let h = '<div class="top"><div><p class="label">ZO Studio · Instagram</p><h1 id="t-today">' + hello + '</h1><p class="sub">' + esc(fmtDay(now)) + '</p></div>' +
    '<button type="button" class="icon-btn" data-settings aria-label="Réglages">' + ICON.gear + '</button></div>';
  const MSHORT = ["janv", "févr", "mars", "avr", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
  const first = posts[0].at, last = posts[posts.length - 1].at, sm = d => d.getDate() + " " + MSHORT[d.getMonth()];
  h += '<div class="prog"><div class="prog-row"><span class="label">Planning du ' + sm(first) + ' au ' + sm(last) + '</span><span class="prog-n">' + n + ' / ' + total + ' publiés</span></div>' +
    '<div class="bar"><i style="width:' + (n / total * 100) + '%"></i></div></div>';
  const todo = unplanned();
  if (todo.length) h += '<button type="button" class="alert" data-go="shop"><span><b>' + todo.length + ' annonce' + (todo.length > 1 ? "s" : "") + ' Etsy</b> sans post prévu' +
    (todo.some(isNew) ? ', dont des nouveautés' : '') + '</span><span aria-hidden="true">›</span></button>';

  // le post du jour passe en premier, puis ce qui est en retard, puis le prochain
  const hero = posts.find(p => !isDone(p) && dayDiff(p.at, now) === 0) || late[0] || next;
  if (hero) {
    const lateHero = isLate(hero, now);
    h += '<p class="label" style="margin-bottom:8px">' + (lateHero ? "À rattraper" : todays.includes(hero) ? "À publier aujourd'hui" : "Prochain post") + '</p>';
    h += '<article class="card hero" data-pil="' + esc(hero.pillar) + '">' +
      '<div class="when"><span class="day">' + esc(relDay(hero.at, now)) + '</span><span class="time">' + fmtTime(hero.at) + '</span>' +
      '<span class="count' + (lateHero ? " late" : "") + '">' + countdown(hero.at, now) + '</span></div>' +
      '<div class="chips" style="margin-top:8px">' + chips(hero, now) + '<span class="prod">' + esc(hero.product) + '</span></div>' +
      '<h2>' + esc(hero.title) + '</h2>' + strip(hero) +
      '<p class="how"><strong>Visuels :</strong> ' + esc(hero.how) + '</p>' + actions(hero) +
      '<button type="button" class="btn wide" style="margin-top:8px;width:100%" data-open="' + hero.id + '">Voir la légende et le détail</button></article>';
  } else {
    h += '<div class="card hero"><h2>Tout est publié 🎉</h2><p class="sub">Tous les posts du planning sont en ligne. Bravo !</p></div>';
  }

  const others = late.filter(p => p !== hero);
  if (others.length) h += '<div class="section-title"><h2>Encore en retard</h2><span class="label">' + others.length + '</span></div><div class="list">' + others.map(p => row(p, now)).join("") + '</div>';
  const after = posts.filter(p => !isDone(p) && p.at >= now && p !== hero).slice(0, 3);
  if (after.length) h += '<div class="section-title"><h2>Ensuite</h2><button type="button" class="linkish" data-go="plan">Tout le planning</button></div><div class="list">' + after.map(p => row(p, now)).join("") + '</div>';
  $("#v-today").innerHTML = h;
}

function renderPlan(now){
  const pillars = ["Tous", "À faire"].concat([...new Set(posts.map(p => p.pillar))]);
  let h = '<div class="top"><div><p class="label">' + posts.length + ' posts</p><h1 id="t-plan">Planning</h1></div></div>' +
    '<div class="filters" role="group" aria-label="Filtrer">' + pillars.map(f => '<button type="button" class="filter" data-filter="' + esc(f) + '" aria-pressed="' + (f === filter) + '">' + esc(f) + '</button>').join("") + '</div>';
  const list = posts.filter(p => filter === "Tous" || (filter === "À faire" ? !isDone(p) : p.pillar === filter));
  if (!list.length) h += '<p class="empty">Rien ici. Tout est publié !</p>';
  let wk = null;
  list.forEach(p => {
    const ws = weekStart(p.at).getTime();
    if (ws !== wk) {
      if (wk !== null) h += '</div>';
      wk = ws; const s = new Date(ws), cur = ws === weekStart(now).getTime();
      h += '<h2 class="week-h">' + (cur ? "Cette semaine" : "Semaine du " + s.getDate() + " " + MONTHS[s.getMonth()]) + '</h2><div class="list">';
    }
    h += row(p, now);
  });
  if (wk !== null) h += '</div>';
  $("#v-plan").innerHTML = h;
}

function renderCal(now){
  const byDay = {}; posts.forEach(p => { const k = startOfDay(p.at).getTime(); if (!byDay[k] || (isDone(byDay[k]) && !isDone(p))) byDay[k] = p; });
  const months = [...new Set(posts.map(p => p.at.getFullYear() * 12 + p.at.getMonth()))];

    '<div data-pil="' + esc(p.pillar) + '"><div class="when"><span class="day">' + esc(fmtDay(p.at)) + '</span><span class="time">' + fmtTime(p.at) + '</span>' +
    (isDone(p) ? "" : '<span class="count' + (isLate(p, now) ? " late" : "") + '">' + countdown(p.at, now) + '</span>') + '</div>' +
    '<div class="chips" style="margin-top:8px">' + chips(p, now) + '</div><h2>' + esc(p.title) + '</h2>' + strip(p) +
    '<p class="how"><strong>Visuels :</strong> ' + esc(p.how) + '</p>' + actions(p) + etsyBlock(p) +
    '<div class="cap"><div class="cap-head"><span class="label">Légende</span>' + (edits[p.id] != null ? '<button type="button" class="linkish" data-reset="' + p.id + '">Revenir au texte d\'origine</button>' : '') + '</div>' +
    '<textarea id="cap-text" data-id="' + p.id + '" aria-label="Légende">' + esc(caption(p)) + '</textarea>' +
    '<p class="note">Tu peux retoucher la légende ici, elle est gardée sur ton téléphone.</p></div>' +
    (p.custom ? '<div class="actions"><button type="button" class="btn wide" data-remove="' + p.id + '">Retirer ce post du planning</button></div>' : '') + '</div>';
}
function etsyBlock(p){
  if (!shop || !(PRODUCT_WORDS[p.product] || p.listingId)) return "";
  const ls = listingsFor(p);
  if (!ls.length) return p.product === "Take Out" ? "" : '<div class="etsy"><span>Aucune annonce Etsy en ligne pour ce produit en ce moment.</span></div>';
  const l = ls[0];
  return '<div class="etsy"><span>Sur Etsy : <span class="price">' + esc(money(l.price, l.currency)) + '</span></span><a href="' + esc(l.url) + '" target="_blank" rel="noopener">Voir l\'annonce</a></div>';
}

function render(){
  const now = new Date();
  if (view === "today") renderToday(now);
  if (view === "plan") renderPlan(now);
  if (view === "cal") renderCal(now);
  if (view === "shop") renderShop(now);
  if (openId && !$("#sheet").hidden && document.activeElement?.id !== "cap-text") renderSheet(now);
}

/* ---------- actions ---------- */
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200);
}
async function copyCaption(p){
  const txt = caption(p);
  try { await navigator.clipboard.writeText(txt); toast("Légende copiée"); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Légende copiée"); } catch (err) { toast("Copie impossible, sélectionne le texte à la main"); }
    ta.remove();
  }
}
async function saveVisuals(p){
  toast("Préparation des visuels…");
  const files = [];
  for (let i = 0; i < p.images.length; i++) {
    const key = photoKey(p.id, i), name = "zo-" + p.id + "-" + (i + 1);
    if (photos[key]) files.push(new File([photos[key]], name + ".jpg", { type: photos[key].type || "image/jpeg" }));
    else if (p.images[i].src) {
      try { const b = await (await fetch(p.images[i].src)).blob(); files.push(new File([b], name + ".jpg", { type: "image/jpeg" })); } catch (e) {}
    }
  }
  if (!files.length) return toast("Aucun visuel à enregistrer");
  // Sur iPhone et Android : feuille de partage → « Enregistrer N images » dans Photos
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); $("#toast").hidden = true; return; }
    catch (e) { if (e.name === "AbortError") { $("#toast").hidden = true; return; } }
  }
  files.forEach((f, i) => setTimeout(() => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, i * 300));
  toast(files.length + " visuel" + (files.length > 1 ? "s" : "") + " téléchargé" + (files.length > 1 ? "s" : ""));
}

/* rappels : un fichier .ics avec une alerte 15 min avant chaque post (marche avec Calendrier sur iPhone et Google Agenda) */
function exportIcs(){
  const pad = n => String(n).padStart(2, "0");
  const stamp = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
  const fold = s => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const now = new Date();
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ZO Studio//Planning Instagram//FR", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Instagram ZO Studio"];
  posts.filter(p => !isDone(p) && p.at > now).forEach(p => {
    const end = new Date(p.at.getTime() + 15 * 6e4);
    lines.push("BEGIN:VEVENT", "UID:zo-" + p.id + "@zo-studio", "DTSTAMP:" + stamp(now), "DTSTART:" + stamp(p.at), "DTEND:" + stamp(end),
      "SUMMARY:" + fold("📸 " + p.format + " : " + p.title), "DESCRIPTION:" + fold(p.how + "\n\nOuvre l'appli ZO Studio pour les visuels et la légende."),
      "BEGIN:VALARM", "TRIGGER:-PT15M", "ACTION:DISPLAY", "DESCRIPTION:" + fold("Post Instagram dans 15 min : " + p.title), "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  const file = new File([blob], "instagram-zo-studio.ics", { type: "text/calendar" });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    navigator.share({ files: [file] }).catch(() => {});
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  toast("Ouvre le fichier pour ajouter les rappels");
}

/* ---------- réglages ---------- */
function applyTheme(){
  const t = load(KEY_THEME, "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = dark ? "#1c1714" : "#f3eee6");
}
function renderSettings(){
  const t = load(KEY_THEME, "auto");
  $("#settings-in").innerHTML = '<div class="sheet-top"><button type="button" class="icon-btn" data-close aria-label="Retour">' + ICON.back + '</button><span class="label">Réglages</span><span style="width:44px"></span></div>' +
    '<h2>Réglages</h2>' +
    '<div class="card"><p class="label">Rappels</p><p class="sub">Ajoute tous les posts à venir dans ton calendrier, avec une alerte 15 minutes avant l\'heure.</p><div class="actions"><button type="button" class="btn primary wide" data-ics>' + ICON.bell + 'Ajouter les rappels au calendrier</button></div></div>' +
    '<div class="card"><p class="label">Apparence</p><div class="opt" role="group" aria-label="Thème">' +
    [["auto", "Automatique"], ["light", "Clair"], ["dark", "Sombre"]].map(([v, l]) => '<button type="button" class="filter" data-theme-set="' + v + '" aria-pressed="' + (t === v) + '">' + l + '</button>').join("") + '</div></div>' +
    '<div class="card"><p class="label">Installer l\'appli</p><p class="sub"><strong>iPhone :</strong> dans Safari, bouton Partager → « Sur l\'écran d\'accueil ».<br><strong>Android :</strong> dans Chrome, menu ⋮ → « Installer l\'application ».<br>Elle marche ensuite hors connexion, visuels compris.</p></div>' +
    '<div class="card"><p class="label">Données</p><p class="sub">Les coches « Publié », tes légendes retouchées, tes photos et les posts ajoutés depuis la boutique restent sur ce téléphone.</p><div class="actions"><button type="button" class="btn wide" data-reset-all>Tout remettre à zéro</button></div></div>' +
    '<p class="ver">ZO Studio · ' + VERSION + '</p>';
}

/* ---------- lightbox ---------- */
let lbSet = [], lbIdx = 0;
function lbShow(){ $("#lb-img").src = lbSet[lbIdx]; $("#lb-count").textContent = (lbIdx + 1) + " / " + lbSet.length; }
function lbOpen(p, i){
  lbSet = []; let start = 0;
  p.images.forEach((im, j) => { const u = photoUrl(photoKey(p.id, j)) || im.src; if (u) { if (j === i) start = lbSet.length; lbSet.push(u); } });
  lbIdx = start; lbShow(); $("#lb").hidden = false; $("#lb-close").focus();
}
const lbClose = () => $("#lb").hidden = true;
$("#lb-prev").onclick = () => { lbIdx = (lbIdx - 1 + lbSet.length) % lbSet.length; lbShow(); };
$("#lb-next").onclick = () => { lbIdx = (lbIdx + 1) % lbSet.length; lbShow(); };
$("#lb-close").onclick = lbClose;
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") lbClose(); });
let sx = null;
$("#lb").addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
$("#lb").addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) (dx < 0 ? $("#lb-next") : $("#lb-prev")).click(); sx = null; });

/* ---------- navigation ---------- */
function go(v){
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v));
  ["today", "plan", "cal", "shop"].forEach(k => $("#v-" + k).hidden = k !== v);
  render(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", "#" + v); } catch (e) {}
}
function openPost(id){
  openId = id; $("#sheet").hidden = false; $("#sheet").scrollTop = 0; renderSheet(new Date());
  document.body.style.overflow = "hidden";
  try { history.pushState({ sheet: id }, "", "#post-" + id); } catch (e) {}
}
function closeSheets(fromPop){
  const wasOpen = !$("#sheet").hidden || !$("#settings").hidden;
  $("#sheet").hidden = true; $("#settings").hidden = true; openId = null; document.body.style.overflow = "";
  if (wasOpen && !fromPop && history.state && history.state.sheet) history.back();
  render();
}
window.addEventListener("popstate", () => { if (!$("#lb").hidden) lbClose(); closeSheets(true); });

let pendingPhoto = null;
$("#photo-input").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f || !pendingPhoto) return;
  await putPhoto(pendingPhoto, f); pendingPhoto = null; toast("Photo ajoutée"); render();
});

document.addEventListener("click", e => {
  const t = e.target.closest("button,a,[data-toggle]"); if (!t) return;
  const d = t.dataset;
  if (d.view) return go(d.view);
  if (d.go) return go(d.go);
  if (d.toggle) { e.stopPropagation(); const on = !isDone(byId[d.toggle]); setDone(d.toggle, on); if (on) toast("Bravo, c'est publié ✨"); return; }
  if (d.open) return openPost(d.open);
  if (d.close != null) return closeSheets();
  if (d.copy) return copyCaption(byId[d.copy]);
  if (d.save) return saveVisuals(byId[d.save]);
  if (d.post) return lbOpen(byId[d.post], +d.i);
  if (d.photo) { pendingPhoto = d.photo; return $("#photo-input").click(); }
  if (d.add) return addListingPost(+d.add);
  if (d.remove) { if (confirm("Retirer ce post du planning ?")) removeCustom(d.remove); return; }
  if (d.filter) { filter = d.filter; return render(); }
  if (d.settings != null) { renderSettings(); $("#settings").hidden = false; document.body.style.overflow = "hidden"; try { history.pushState({ sheet: "settings" }, "", "#reglages"); } catch (err) {} return; }
  if (d.themeSet) { save(KEY_THEME, d.themeSet); applyTheme(); return renderSettings(); }
  if (d.ics != null) return exportIcs();
  if (d.reset) { delete edits[d.reset]; save(KEY_EDIT, edits); return renderSheet(new Date()); }
  if (d.resetAll != null) {
    if (!confirm("Effacer les coches, les légendes retouchées, les photos et les posts ajoutés ?")) return;
    done = {}; edits = {}; custom = []; save(KEY, done); save(KEY_EDIT, edits); save(KEY_CUSTOM, custom); rebuild();
    Object.keys(photos).forEach(k => delete photos[k]);
    idb.then(db => db && db.transaction("photos", "readwrite").objectStore("photos").clear());
    toast("Tout est remis à zéro"); return closeSheets();
  }
  if (d.insta != null) {
    // si Instagram n'est pas installé (ordinateur), on ouvre le site
    setTimeout(() => { if (document.visibilityState === "visible") window.open("https://www.instagram.com/", "_blank"); }, 900);
  }
});
document.addEventListener("input", e => {
  if (e.target.id !== "cap-text") return;
  const id = e.target.dataset.id;
  if (e.target.value === byId[id].caption) delete edits[id]; else edits[id] = e.target.value;
  save(KEY_EDIT, edits);
});
document.addEventListener("keydown", e => {
  if (!$("#lb").hidden) {
    if (e.key === "Escape") lbClose();
    if (e.key === "ArrowRight") $("#lb-next").click();
    if (e.key === "ArrowLeft") $("#lb-prev").click();
  } else if (e.key === "Escape" && (!$("#sheet").hidden || !$("#settings").hidden)) closeSheets();
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") render(); });
setInterval(render, 60000);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

/* ---------- démarrage ---------- */
applyTheme();
const start = (location.hash || "").slice(1);
go(["today", "plan", "cal", "shop"].includes(start) ? start : "today");
loadPhotos().then(render);
loadShop().then(render);

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
