<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport Mimi</title>
<meta name="description" content="Quelques minutes par jour pour des épaules toniques : programme de la semaine, exercices, chrono et suivi du poids.">
<meta name="theme-color" content="#FBE1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sport Mimi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6F8;--surface:#FFFFFF;--blush:#FBE1E8;--rose:#E0658A;--rose-ink:#FFFFFF;--berry:#7B2D4B;
  --lilac:#ECE3FA;--peach:#FFE7DA;--mint:#DFF3EA;--text:#3B1F2B;--muted:#8A6573;--line:#F3D4DD;
  --shadow:0 8px 24px rgba(123,45,75,.10);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1117;--surface:#281920;--blush:#3B2130;--rose:#F07FA0;--rose-ink:#2A0F1B;--berry:#F8C4D3;
    --lilac:#2F2640;--peach:#3A2721;--mint:#1F3129;--text:#FBEAF0;--muted:#C59BAA;--line:#43283A;
    --shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1117;--surface:#281920;--blush:#3B2130;--rose:#F07FA0;--rose-ink:#2A0F1B;--berry:#F8C4D3;
  --lilac:#2F2640;--peach:#3A2721;--mint:#1F3129;--text:#FBEAF0;--muted:#C59BAA;--line:#43283A;
  --shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;line-height:1.15;font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;margin:28px 0 12px}
h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
img,svg{max-width:100%}
.app{max-width:560px;margin:0 auto;padding:0 16px 120px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Hero festonné */
.hero{background:var(--blush);margin:0 -16px 30px;padding:26px 20px 26px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:13px;
  background:radial-gradient(circle at 13px 0,var(--blush) 12px,transparent 12.5px) 0 0/26px 13px repeat-x}
.hero .date{font-size:14px;color:var(--muted);font-weight:700}
.hero h1{font-weight:900;font-size:clamp(32px,9vw,44px);margin:4px 0 6px;color:var(--berry)}
.hero .msg{max-width:36ch}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 16px}
.dpill{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.dpill .e{font-size:20px;line-height:1.2}
.dpill.today{color:var(--berry)}
.dpill[aria-pressed="true"]{border-color:var(--rose)}
.dpill .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.dpill .dot.ok{background:var(--rose)}

.session{border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.session .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.session .big{font-size:40px;line-height:1}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--rose);border-radius:99px;transition:width .4s}

.exrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 10px 10px 10px;margin-top:8px}
.exrow .bub{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--peach)}
.exrow .info{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.exrow .info b{display:block;font-size:15px;line-height:1.3}
.exrow .info span{font-size:13px;color:var(--muted)}
.check{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.check[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.rm{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--blush);color:var(--berry);font-weight:800}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:800;background:var(--rose);color:var(--rose-ink);box-shadow:0 6px 16px rgba(224,101,138,.35)}
.btn.soft{background:var(--surface);color:var(--berry);box-shadow:none;border:2px solid var(--line)}
.btn.full{width:100%}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:Nunito,system-ui,sans-serif;font-size:22px;color:var(--berry)}
.stat span{font-size:12px;color:var(--muted)}

/* Programmes */
.prog{border-radius:26px;padding:18px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.prog .big{font-size:44px;grid-row:span 3;line-height:1}
.prog .emos{font-size:20px;letter-spacing:2px}
.prog .row{grid-column:2;margin-top:8px}

/* Filtres */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:4px 16px}
.scroll-x .chips{flex-wrap:nowrap}
.scroll-x .chip{flex:none}

.note{background:var(--lilac);border-radius:18px;padding:12px 14px;font-size:14px;margin:12px 0}

/* Formulaires */
.card{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input.in{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:16px;padding:12px 14px;font:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.avatars{display:flex;gap:8px;flex-wrap:wrap}
.av{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-size:24px}
.av[aria-pressed="true"]{border-color:var(--rose);background:var(--blush)}
.err{color:#C2185B;font-weight:700;font-size:14px;margin-top:10px;min-height:1em}

/* Graphique */
.chart{background:var(--surface);border-radius:24px;padding:12px 8px 6px;box-shadow:var(--shadow);overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:50%;background:var(--blush);display:block}
.wlist{list-style:none;padding:0;margin:0}
.wlist li{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);z-index:20}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 11px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs .e{font-size:22px;filter:grayscale(.7);opacity:.65;transition:transform .2s}
nav.tabs button[aria-current="page"]{color:var(--berry)}
nav.tabs button[aria-current="page"] .e{filter:none;opacity:1;transform:translateY(-2px) scale(1.1)}

/* Feuille & lecteur */
.sheet-bg{position:fixed;inset:0;background:rgba(40,10,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet .hemo{font-size:64px;text-align:center}
.daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.daysel button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 0;font-weight:800}

.player{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.pbar{display:flex;gap:4px;margin:10px 0 18px}
.pbar i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.pbar i.on{background:var(--rose)}
.pem{font-size:110px;text-align:center;line-height:1.1;margin:10px 0;background:var(--blush);border-radius:50%;width:190px;height:190px;display:grid;place-items:center;align-self:center}
.player h2{text-align:center;font-size:30px;margin:14px 0 4px;color:var(--berry)}
.dose{text-align:center;font-weight:800;font-size:20px}
.timer{font-family:Nunito,system-ui,sans-serif;font-size:56px;text-align:center;color:var(--rose);min-height:1.2em}
.close{position:absolute;right:0;top:0;border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;font-size:18px}
.party{font-size:40px;letter-spacing:6px;text-align:center}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="overlay"></div>

<script>
/* ---------- Données ---------- */
const EQ={aucun:{n:"Sans matériel",e:"🙌"},mur:{n:"Mur",e:"🧱"},elastique:{n:"Élastique",e:"🎀"},poids:{n:"Petits poids",e:"🏋️‍♀️"},chaise:{n:"Chaise",e:"🪑"}};
const EX=[
 {id:"rouleaux",e:"🫧",n:"Roulés d'épaules",eq:["aucun"],t:"mob",lvl:1,dose:"2 × 10",d:"Monte les épaules vers les oreilles, roule-les vers l'arrière puis relâche-les bien vers le bas.",tip:"Respire lentement, c'est ton moment."},
 {id:"cercles",e:"🌀",n:"Cercles de bras",eq:["aucun"],t:"mob",lvl:1,dose:"2 × 30 s",sec:30,d:"Bras tendus sur les côtés, dessine de petits cercles vers l'avant puis vers l'arrière en les agrandissant petit à petit.",tip:"Épaules basses, loin des oreilles."},
 {id:"pompemur",e:"🧱",n:"Pompes au mur",eq:["mur"],t:"force",lvl:1,dose:"3 × 10",d:"Face au mur, mains à hauteur d'épaules, un peu plus larges. Plie les coudes pour approcher la poitrine du mur, puis repousse.",tip:"Plus tes pieds sont loin du mur, plus c'est intense."},
 {id:"anges",e:"👼",n:"Anges au mur",eq:["mur"],t:"mob",lvl:1,dose:"2 × 8",d:"Dos, tête et fesses contre le mur, bras en W. Glisse les bras vers le haut en gardant le contact, puis redescends.",tip:"Le contact avec le mur compte plus que la hauteur."},
 {id:"scapmur",e:"🌼",n:"Pompes scapulaires au mur",eq:["mur"],t:"mob",lvl:1,dose:"2 × 12",d:"Bras tendus contre le mur, rapproche tes omoplates sans plier les coudes, puis écarte-les en poussant le mur.",tip:"Petit mouvement, gros effet sur la posture."},
 {id:"tapmur",e:"💗",n:"Tapotements d'épaule au mur",eq:["mur"],t:"tonic",lvl:1,dose:"2 × 20 s",sec:20,d:"En appui incliné, mains au mur, touche l'épaule opposée avec une main, puis alterne.",tip:"Garde le bassin bien immobile."},
 {id:"etirmur",e:"🧘‍♀️",n:"Étirement pectoraux au mur",eq:["mur"],t:"stretch",lvl:1,dose:"30 s par côté",sec:30,d:"Avant-bras contre le mur, coude à hauteur d'épaule, tourne doucement le buste du côté opposé.",tip:"Étirement doux, jamais douloureux."},
 {id:"ecartes",e:"🎀",n:"Écartés à l'élastique",eq:["elastique"],t:"force",lvl:1,dose:"3 × 12",d:"Bras tendus devant toi, élastique entre les mains. Écarte les bras en ouvrant la poitrine, puis reviens lentement.",tip:"Serre les omoplates à la fin du geste."},
 {id:"rotext",e:"🌸",n:"Rotation externe à l'élastique",eq:["elastique"],t:"force",lvl:1,dose:"2 × 12 par bras",d:"Coude collé au corps et plié à 90°, tire l'élastique vers l'extérieur sans décoller le coude.",tip:"Parfait pour protéger l'épaule. Va lentement."},
 {id:"rowing",e:"🚣‍♀️",n:"Rowing à l'élastique",eq:["elastique"],t:"force",lvl:1,dose:"3 × 12",d:"Assise jambes tendues, élastique autour des pieds, tire les mains vers le nombril en ramenant les coudes en arrière.",tip:"Pense « poitrine fière »."},
 {id:"facepull",e:"🎐",n:"Tirage visage à l'élastique",eq:["elastique"],t:"tonic",lvl:2,dose:"3 × 12",d:"Élastique fixé à hauteur de visage (poignée de porte fermée), tire vers ton front en écartant les mains.",tip:"Vérifie que l'élastique est solidement fixé."},
 {id:"laterales",e:"🦋",n:"Élévations latérales",eq:["poids"],t:"force",lvl:1,dose:"3 × 10",d:"Debout, un poids léger dans chaque main. Lève les bras sur les côtés jusqu'à hauteur d'épaules, redescends en 3 secondes.",tip:"Pas de poids ? Deux bouteilles d'eau font très bien l'affaire."},
 {id:"frontales",e:"🌷",n:"Élévations frontales",eq:["poids"],t:"tonic",lvl:1,dose:"2 × 10",d:"Lève les bras tendus devant toi jusqu'à hauteur d'épaules, ensemble ou en alternant.",tip:"Ventre engagé, pas de balancier."},
 {id:"developpe",e:"👑",n:"Développé assis",eq:["poids","chaise"],t:"force",lvl:1,dose:"3 × 10",d:"Assise bien droite sur une chaise, poids à hauteur d'épaules, pousse vers le plafond puis redescends.",tip:"Ne verrouille pas les coudes en haut."},
 {id:"ytw",e:"✨",n:"Y-T-W penchée",eq:["chaise"],t:"mob",lvl:2,dose:"2 × 6 par lettre",d:"Assise au bord de la chaise, buste penché en avant, dessine un Y, puis un T, puis un W avec tes bras.",tip:"Ajoute de petits poids quand ça devient facile."},
 {id:"pompechaise",e:"💪",n:"Pompes inclinées sur chaise",eq:["chaise"],t:"force",lvl:2,dose:"3 × 8",d:"Mains sur l'assise d'une chaise calée contre un mur, corps gainé, descends la poitrine puis pousse.",tip:"Chaise contre le mur pour qu'elle ne glisse pas."},
 {id:"dips",e:"🪑",n:"Dips sur chaise",eq:["chaise"],t:"tonic",lvl:2,dose:"2 × 8",d:"Mains sur le bord de la chaise derrière toi, genoux pliés. Plie les coudes puis remonte.",tip:"Petite amplitude au début : l'épaule doit rester confortable."},
 {id:"croise",e:"🤍",n:"Étirement épaule croisée",eq:["aucun"],t:"stretch",lvl:1,dose:"30 s par côté",sec:30,d:"Ramène un bras tendu devant ta poitrine et maintiens-le avec l'autre main.",tip:"Expire en relâchant l'épaule."}
];
const EXM=Object.fromEntries(EX.map(x=>[x.id,x]));
const PROGS=[
 {id:"reveil",e:"☀️",n:"Réveil des épaules",min:8,bg:"var(--peach)",d:"Mobilité douce pour bien démarrer la journée.",ex:["rouleaux","cercles","anges","scapmur","croise"]},
 {id:"posture",e:"🦢",n:"Posture de cygne",min:12,bg:"var(--lilac)",d:"Ouvre la poitrine et redresse le dos après une journée assise.",ex:["cercles","anges","ecartes","rotext","etirmur","croise"]},
 {id:"murchaise",e:"🏠",n:"Spécial mur & chaise",min:14,bg:"var(--blush)",d:"Rien à acheter : ton salon suffit.",ex:["rouleaux","pompemur","scapmur","tapmur","ytw","etirmur"]},
 {id:"tonique",e:"🦋",n:"Tonique en douceur",min:18,bg:"var(--mint)",d:"Élastique et petits poids pour des épaules dessinées.",ex:["cercles","pompemur","laterales","rowing","developpe","ecartes","croise"]}
];
const TYPES={force:{n:"Force douce",e:"💪",bg:"var(--blush)"},mob:{n:"Mobilité & posture",e:"🧘‍♀️",bg:"var(--lilac)"},tonic:{n:"Tonique",e:"🌸",bg:"var(--peach)"}};
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const DS=["L","M","M","J","V","S","D"];
const AVATARS=["🌷","🦋","🌸","🍓","🌙","🐚","🦩","💐"];
const MSGS=["Dix minutes pour toi, tes épaules te diront merci.","Doucement mais sûrement : la régularité fait tout.","Épaules basses, sourire en haut.","Chaque petite séance compte.","Aujourd'hui on prend soin de soi."];

/* ---------- Utilitaires ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayIso=()=>iso(new Date());
const todayIdx=()=>(new Date().getDay()+6)%7;
function monday(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-todayIdx());return d}
const weekKey=()=>iso(monday());
function dayIso(i){const d=monday();d.setDate(d.getDate()+i);return iso(d)}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kg=n=>(Math.round(n*10)/10).toFixed(1).replace(".",",");
const frDate=s=>{const[y,m,d]=s.split("-");return d+"/"+m};
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- État & stockage ---------- */
let S={profile:null,weights:[],done:{},plan:null};
let UI={tab:"today",day:todayIdx(),filter:"tous",sheet:null,player:null,draft:null};
const LKEY="epaules-douceur-v1";

function normalize(d){return{profile:d.profile||null,weights:Array.isArray(d.weights)?d.weights:[],done:d.done||{},plan:d.plan||null}}
function loadLocal(){try{const r=localStorage.getItem(LKEY);if(r)S=normalize(JSON.parse(r))}catch(e){}}
function cacheLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}
function save(){cacheLocal()}
/* ---------- Planning de la semaine ---------- */
const sig=p=>JSON.stringify([p.equip.slice().sort(),p.level,p.days]);
function pool(p){return EX.filter(x=>x.eq.every(q=>q==="aucun"||p.equip.includes(q))&&x.lvl<=p.level)}
function buildDay(type,r,p){
  const ok=pool(p),warmIds=["cercles","rouleaux"];
  const warm=shuffle(ok.filter(x=>warmIds.includes(x.id)),r)[0];
  const stretch=shuffle(ok.filter(x=>x.t==="stretch"),r)[0];
  const n=p.level>=2?4:3;
  let main=shuffle(ok.filter(x=>x.t===type&&!warmIds.includes(x.id)),r);
  if(main.length<n)main=main.concat(shuffle(ok.filter(x=>x.t!=="stretch"&&!warmIds.includes(x.id)&&!main.includes(x)),r));
  return{type,ex:[warm,...main.slice(0,n),stretch].filter(Boolean).map(x=>x.id)};
}
function genPlan(p,seed){
  const wk=weekKey(),r=rng(hash(wk+(seed||"")));
  const order=["force","mob","tonic"];let k=0;
  const keepExtras=S.plan&&S.plan.weekKey===wk?S.plan.extras||{}:{};
  return{weekKey:wk,sig:sig(p),days:p.days.map(on=>on?buildDay(order[k++%3],r,p):null),extras:keepExtras};
}
function ensurePlan(force){
  if(!S.profile)return;
  if(force||!S.plan||S.plan.weekKey!==weekKey()||S.plan.sig!==sig(S.profile)){
    S.plan=genPlan(S.profile,force?String(Date.now()):"");save();
  }
}
const doneOn=d=>S.done[d]||[];
const isDone=(d,id)=>doneOn(d).includes(id);
function dayItems(i){const p=S.plan;if(!p)return{main:[],extra:[]};return{main:p.days[i]?p.days[i].ex:[],extra:(p.extras&&p.extras[i])||[]}}
function dayComplete(i){const{main,extra}=dayItems(i),all=main.concat(extra);return all.length>0&&all.every(id=>isDone(dayIso(i),id))}
function dose(x){const lv=S.profile?S.profile.level:1;return lv>=2&&/^\d ×/.test(x.dose)?x.dose.replace(/^\d/,m=>+m+1):x.dose}

function chartSVG(ws,goal){
  if(!ws.length)return `<p class="muted small" style="padding:30px 12px;text-align:center">Ajoute ta première pesée pour voir ta courbe 🌷</p>`;
  const W=360,H=200,L=36,R=14,T=16,B=28;
  const t=ws.map(w=>new Date(w.d+"T12:00").getTime());
  let x0=Math.min(...t),x1=Math.max(...t);if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  const vals=ws.map(w=>w.kg).concat(goal?[goal]:[]);
  let y0=Math.floor(Math.min(...vals)-1),y1=Math.ceil(Math.max(...vals)+1);
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  const pts=ws.map((w,i)=>[X(t[i]),Y(w.kg)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`;
  const ticks=[y0,(y0+y1)/2,y1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de poids">
  <defs><linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rose);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--rose);stop-opacity:0"/></linearGradient></defs>
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${kg(v).replace(",0","")}</text>`).join("")}
  ${goal?`<line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" style="stroke:var(--berry)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-R}" y="${Y(goal)-6}" text-anchor="end" font-size="11" font-weight="700" style="fill:var(--berry)">🎯 ${kg(goal)} kg</text>`:""}
  ${ws.length>1?`<path d="${area}" fill="url(#gw)"/><path d="${line}" fill="none" style="stroke:var(--rose)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:""}
  ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" style="fill:var(--surface);stroke:var(--rose)" stroke-width="3"/>`).join("")}
  <text x="${L}" y="${H-8}" font-size="11" style="fill:var(--muted)">${frDate(ws[0].d)}</text>
  <text x="${W-R}" y="${H-8}" font-size="11" text-anchor="end" style="fill:var(--muted)">${frDate(ws[ws.length-1].d)}</text>
  </svg>`;
}

  <div class="chart">${chartSVG(ws,g)}</div>
  <div class="stats">

    <div class="stat"><b>${ws.length>1?(diff>0?"+":diff<0?"−":"")+kg(Math.abs(diff)):"–"}</b><span>kg depuis le début</span></div>

  ${ws.length?`<h2>Historique</h2><div class="card"><ul class="wlist">${ws.slice().reverse().map((w,ri)=>{const i=ws.length-1-ri;return `<li><span>${new Date(w.d+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</span><span class="row"><b>${kg(w.kg)} kg</b><button class="rm" aria-label="Supprimer" data-act="rmWeight" data-i="${i}">×</button></span></li>`}).join("")}</ul></div>`:""}`;
}

  toggle:d=>{const a=S.done[d.date]||[];S.done[d.date]=a.includes(d.id)?a.filter(x=>x!==d.id):a.concat(d.id);if(!S.done[d.date].length)delete S.done[d.date];save();render()},
  addExtra:d=>{const i=d.day;S.plan.extras=S.plan.extras||{};const a=S.plan.extras[i]||[];if(!a.includes(d.id))S.plan.extras[i]=a.concat(d.id);save();UI.sheet=null;UI.tab="today";UI.day=+i;render();scrollTo(0,0)},
  rmExtra:d=>{const a=(S.plan.extras||{})[d.day]||[];S.plan.extras[d.day]=a.filter(x=>x!==d.id);if(!S.plan.extras[d.day].length)delete S.plan.extras[d.day];save();render()},
  playDay:d=>{const{main,extra}=dayItems(+d.day);play(main.concat(extra),TYPES[S.plan.days[+d.day].type].n)},
  playExtras:d=>play(dayItems(+d.day).extra,"Mes bonus"),
  playProg:d=>{const g=PROGS.find(x=>x.id===d.id);play(g.ex,g.n)},
  tryEx:d=>play([d.id],"Exercice libre"),
  next:()=>{const P=UI.player;stopTimer();markDone(P.ids[P.i]);P.i++;renderOverlay()},
  prev:()=>{stopTimer();UI.player.i=Math.max(0,UI.player.i-1);renderOverlay()},
  timer:d=>startTimer(+d.v),
  closePlayer:()=>{stopTimer();UI.player=null;renderOverlay();render()},
  regen:()=>{ensurePlan(true);UI.tab="today";UI.day=todayIdx();render();scrollTo(0,0)},
  avatar:(d,el)=>{UI.draft.avatar=d.v;el.parentNode.querySelectorAll(".av").forEach(b=>b.setAttribute("aria-pressed",b===el))},
  level:(d,el)=>{UI.draft.level=+d.v;el.parentNode.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b===el))},
  equip:(d,el)=>{const a=UI.draft.equip,on=a.includes(d.v);UI.draft.equip=on?a.filter(x=>x!==d.v):a.concat(d.v);el.setAttribute("aria-pressed",!on)},
  dayopt:(d,el)=>{const i=+d.v;UI.draft.days[i]=!UI.draft.days[i];el.setAttribute("aria-pressed",UI.draft.days[i])},
  saveProfile:()=>{
    const v=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
    const err=document.getElementById("f-err"),dr=UI.draft,isNew=!S.profile;
    const name=v("f-name"),age=+v("f-age")||null,goalRaw=v("f-goal").replace(",","."),goal=goalRaw?+goalRaw:null,wRaw=isNew?v("f-w").replace(",","."):"";
    if(!name){err.textContent="Indique ton prénom pour continuer.";return}
    if(!dr.days.some(Boolean)){err.textContent="Choisis au moins un jour de séance.";return}
    if(goal!=null&&(isNaN(goal)||goal<25||goal>250)){err.textContent="L'objectif doit être un poids entre 25 et 250 kg.";return}
    if(wRaw&&(isNaN(+wRaw)||+wRaw<25||+wRaw>250)){err.textContent="Le poids doit être entre 25 et 250 kg.";return}
    S.profile={name,age,goal,avatar:dr.avatar,level:dr.level,equip:dr.equip.slice(),days:dr.days.slice(),created:(S.profile&&S.profile.created)||todayIso()};
    if(wRaw)addW(todayIso(),+wRaw);
    UI.draft=null;ensurePlan();save();UI.tab="today";UI.day=todayIdx();render();scrollTo(0,0);
  },
  addWeight:()=>{
    const d=document.getElementById("w-date").value,raw=document.getElementById("w-kg").value.replace(",","."),err=document.getElementById("w-err");
    if(!d){err.textContent="Choisis une date.";return}
    if(!raw||isNaN(+raw)||+raw<25||+raw>250){err.textContent="Indique un poids entre 25 et 250 kg.";return}
    addW(d,+raw);save();render();
  },
  rmWeight:d=>{S.weights.splice(+d.i,1);save();render()},
  exportData:()=>{
    const blob=new Blob([JSON.stringify({app:"sport-mimi",version:1,exported:new Date().toISOString(),data:S},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sport-mimi-"+todayIso()+".json";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  importData:()=>{
    const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
    inp.onchange=async()=>{
      const f=inp.files&&inp.files[0],err=document.getElementById("io-err");if(!f)return;
      try{
        const j=JSON.parse(await f.text()),d=j&&j.app==="sport-mimi"?j.data:j;
        if(!d||typeof d!=="object"||!d.profile||!d.profile.name)throw new Error("format");
        if(!confirm("Remplacer tes données actuelles par cette sauvegarde ?"))return;
        S=normalize(d);ensurePlan();save();UI.draft=null;UI.tab="today";UI.day=todayIdx();render();scrollTo(0,0);
      }catch(e){if(err)err.textContent="Ce fichier n'est pas une sauvegarde Sport Mimi valide."}
    };
    inp.click();
  },
  reset:()=>{if(!confirm("Effacer ton profil, tes pesées et tes séances ?"))return;S={profile:null,weights:[],done:{},plan:null};UI.draft=null;save();render()}
};
function addW(d,v){S.weights=S.weights.filter(w=>w.d!==d).concat({d,kg:Math.round(v*10)/10}).sort((a,b)=>a.d<b.d?-1:1)}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el.dataset,el,e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&UI.sheet){UI.sheet=null;renderOverlay()}});

loadLocal();render();
window.addEventListener("storage",e=>{if(e.key===LKEY){loadLocal();render()}});
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("Service worker",e)));
}
</script>
</body>
</html>
